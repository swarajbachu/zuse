name: Extension validation
on:
  pull_request:
    paths: ["extensions/**", "packages/extension-*/**", "scripts/*extension*", ".github/workflows/extension*.yml", "bun.lock"]
  push:
    branches: [main]
    paths: ["extensions/**", "packages/extension-*/**", "scripts/*extension*", "bun.lock"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx vitest run packages/extension-host/test extensions/*/test
      - run: bun run check-types
      - run: bun scripts/build-extensions.ts
      - run: bun run --cwd packages/extension-sdk pack:release
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-extension-validation
          path: .context/extensions-release
