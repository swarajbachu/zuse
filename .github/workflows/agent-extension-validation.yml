name: Agent extension validation
on:
  pull_request:
    paths:
      - "apps/server/src/agent-plugin/**"
      - "apps/server/src/provider/**"
      - "packages/contracts/src/agent-plugin.ts"
      - "apps/renderer/src/lib/agent-plugin-client.ts"
      - "apps/server/test/**/agent-plugin.test.ts"
      - "apps/renderer/src/components/settings/agent-plugins-pane.tsx"
      - "apps/renderer/test/unit/agent-plugins-pane.test.tsx"
      - "packages/acp/**"
      - "packages/agents/src/drivers/extension-acp.ts"
      - "packages/agents/src/drivers/acp/**"
      - "packages/agents/test/**/extension-acp*"
      - "packages/extension-*/**"
      - "packages/serve/src/extension-init.ts"
      - "packages/serve/test/extension-init.test.ts"
      - "scripts/test-extension-starters.ts"
      - "scripts/pack-extension-sdk.ts"
      - "bun.lock"
      - ".github/workflows/agent-extension-validation.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check types
        run: bun run check-types
      - name: Test native plugins and supervised agents
        run: bunx vitest run apps/server/test/unit/agent-plugin.test.ts apps/server/test/integration/agent-plugin.test.ts packages/acp/test packages/agents/test/unit/drivers/extension-acp.test.ts packages/extension-host/test packages/serve/test/extension-init.test.ts
      - name: Test plugin settings
        working-directory: apps/renderer
        run: bunx vp test run test/unit/agent-plugins-pane.test.tsx
      - name: Pack the public SDK
        run: |
          bun run --cwd packages/extension-sdk pack:release
          cd .context/sdk-release
          npm pack --pack-destination ..
      - name: Verify standalone projects outside the monorepo
        run: bun scripts/test-extension-starters.ts .context/zuse-extension-sdk-0.3.0.tgz
