name: cloud runtime

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: Runtime channel to publish
        required: true
        default: verify
        type: choice
        options: [verify, staging, production]
  pull_request:
    paths:
      - ".github/workflows/cloud-runtime-staging.yml"
      - "apps/server/**"
      - "infra/cloud-machines/**"
      - "packages/**"
      - "bun.lock"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/cloud-runtime-staging.yml"
      - "apps/server/**"
      - "infra/cloud-machines/**"
      - "packages/**"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: cloud-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Linux runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.publication.outputs.enabled }}
      target: ${{ steps.publication.outputs.target }}
      release_tag: ${{ steps.publication.outputs.release_tag }}
    steps:
      - name: Determine publication mode
        id: publication
        env:
          REQUESTED_TARGET: ${{ inputs.publish_target }}
        run: |
          enabled=false
          target=verify
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            enabled=true
            target=staging
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            enabled=true
            target=production
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_TARGET" != "verify" ]]; then
            if [[ "$REQUESTED_TARGET" == "staging" && "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Staging publication requires main" >&2
              exit 1
            fi
            if [[ "$REQUESTED_TARGET" == "production" && "$GITHUB_REF" != refs/tags/v* ]]; then
              echo "Production publication requires a version tag" >&2
              exit 1
            fi
            enabled=true
            target="$REQUESTED_TARGET"
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "release_tag=cloud-runtime-$target" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsecret-1-dev python3

      - name: Install workspace dependencies
        env:
          HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}
        run: bun install --frozen-lockfile

      - name: Generate ephemeral verification signing key
        if: steps.publication.outputs.enabled != 'true'
        run: |
          node --input-type=module <<'NODE'
          import { generateKeyPairSync } from "node:crypto";
          import { writeFileSync } from "node:fs";

          const { privateKey } = generateKeyPairSync("ed25519");
          writeFileSync(
            `${process.env.RUNNER_TEMP}/runtime-signing-private.jwk`,
            JSON.stringify(privateKey.export({ format: "jwk" })),
            { mode: 0o600 },
          );
          NODE

      - name: Load trusted signing key
        if: steps.publication.outputs.enabled == 'true'
        env:
          STAGING_SIGNING_KEY: ${{ secrets.ZUSE_RUNTIME_SIGNING_PRIVATE_JWK }}
          PRODUCTION_SIGNING_KEY: ${{ secrets.ZUSE_PRODUCTION_RUNTIME_SIGNING_PRIVATE_JWK }}
          TARGET: ${{ steps.publication.outputs.target }}
        run: |
          if [[ "$TARGET" == "production" ]]; then
            signing_key="$PRODUCTION_SIGNING_KEY"
          else
            signing_key="$STAGING_SIGNING_KEY"
          fi
          test -n "$signing_key"
          printf '%s' "$signing_key" > "$RUNNER_TEMP/runtime-signing-private.jwk"
          chmod 0600 "$RUNNER_TEMP/runtime-signing-private.jwk"

      - name: Build signed runtime
        env:
          ZUSE_RUNTIME_ASSET_NAME: zuse-runtime-linux-x64-${{ github.sha }}.tar.gz
          ZUSE_RUNTIME_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.publication.outputs.release_tag }}/zuse-runtime-linux-x64-${{ github.sha }}.tar.gz
          ZUSE_RUNTIME_VERSION: ${{ github.sha }}
        run: |
          export ZUSE_RUNTIME_SIGNING_PRIVATE_JWK="$(< "$RUNNER_TEMP/runtime-signing-private.jwk")"
          bun --filter @zusehq/server build:cloud-runtime

      - name: Verify signed manifest and archive
        env:
          ZUSE_RUNTIME_ASSET_NAME: zuse-runtime-linux-x64-${{ github.sha }}.tar.gz
          ZUSE_RUNTIME_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.publication.outputs.release_tag }}/zuse-runtime-linux-x64-${{ github.sha }}.tar.gz
        run: |
          node --input-type=module <<'NODE'
          import { createHash, createPrivateKey, createPublicKey, verify } from "node:crypto";
          import { readFile } from "node:fs/promises";

          const root = "apps/server/dist-cloud";
          const signed = JSON.parse(await readFile(`${root}/stable-manifest.json`, "utf8"));
          const { signature, ...manifest } = signed;
          const archive = await readFile(`${root}/${process.env.ZUSE_RUNTIME_ASSET_NAME}`);
          const privateJwk = await readFile(
            `${process.env.RUNNER_TEMP}/runtime-signing-private.jwk`,
            "utf8",
          );
          const privateKey = createPrivateKey({
            key: JSON.parse(privateJwk),
            format: "jwk",
          });
          const signatureValid = verify(
            null,
            Buffer.from(JSON.stringify(manifest)),
            createPublicKey(privateKey),
            Buffer.from(signature, "base64url"),
          );
          const digest = createHash("sha256").update(archive).digest("hex");
          if (!signatureValid || digest !== manifest.sha256 || manifest.url !== process.env.ZUSE_RUNTIME_URL) {
            throw new Error("Runtime release verification failed");
          }
          NODE
          tar -tzf "apps/server/dist-cloud/$ZUSE_RUNTIME_ASSET_NAME" >/dev/null

      - name: Smoke-test clean runtime archive
        env:
          ZUSE_RUNTIME_ASSET_NAME: zuse-runtime-linux-x64-${{ github.sha }}.tar.gz
        run: |
          mkdir "$RUNNER_TEMP/runtime-smoke"
          tar -xzf "apps/server/dist-cloud/$ZUSE_RUNTIME_ASSET_NAME" \
            -C "$RUNNER_TEMP/runtime-smoke"
          cd "$RUNNER_TEMP/runtime-smoke"
          node --input-type=module <<'NODE'
          import { createRequire } from "node:module";

          const require = createRequire(import.meta.url);
          require("node-pty");
          require("tree-sitter");
          require("tree-sitter-javascript");
          require("tree-sitter-json");
          require("tree-sitter-typescript");
          const toolchain = require("./toolchain-manifest.json");
          const runtime = require("./runtime-metadata.json");
          if (
            toolchain.architecture !== "linux-x64" ||
            toolchain.npmPackages["@openai/codex"] !== "0.144.5" ||
            runtime.schemaVersion !== 1 ||
            typeof runtime.appVersion !== "string" ||
            typeof runtime.runtimeVersion !== "string"
          ) {
            throw new Error("Toolchain manifest verification failed");
          }
          await import("./bin.mjs");
          NODE
          node --check runtime-updater.mjs
          node --check runtime-update-trigger.mjs
          node --check toolchain-reconciler.mjs

      - name: Stage release artifacts
        if: steps.publication.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.publication.outputs.target }}-cloud-runtime-${{ github.sha }}
          path: |
            apps/server/dist-cloud/zuse-runtime-linux-x64-${{ github.sha }}.tar.gz
            apps/server/dist-cloud/stable-manifest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish signed channel
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_TARGET: ${{ needs.build.outputs.target }}
      ZUSE_RUNTIME_ASSET_NAME: zuse-runtime-linux-x64-${{ github.sha }}.tar.gz
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.target }}-cloud-runtime-${{ github.sha }}
          path: dist-cloud

      - name: Publish archive before stable manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "${RELEASE_TARGET^} cloud runtime" \
              --notes "Signed immutable $RELEASE_TARGET runtime from $GITHUB_SHA."
          fi
          gh release upload "$RELEASE_TAG" \
            "dist-cloud/$ZUSE_RUNTIME_ASSET_NAME" \
            --clobber
          gh release upload "$RELEASE_TAG" \
            "dist-cloud/stable-manifest.json" \
            --clobber
